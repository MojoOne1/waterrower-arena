# Arena server for rowing against others.
#
# The rowing computers (ESP32-S3 running MojoOne1/waterrower-mqtt, branch
# esp-only) connect outbound to this server, so nobody needs port forwarding. Cloudflare Tunnel publishes it:
#
#   .env next to this file:
#     ARENA_ADMIN_PASSWORD=something-long
#     TUNNEL_TOKEN=...            (Cloudflare Zero Trust -> Tunnels)
#   (see .env.example; the full guide is docs/betrieb.md)
#
# In the tunnel, point your hostname (e.g. arena.example.com) at http://arena:8090.
# Then: docker compose up -d --build
# In the arena create an athlete, mint a token under "Tracker-Verbindung" and
# paste it with https://arena.example.com into the ESP's web page (Arena card).
#
# Without Cloudflare (own reverse proxy, or plain http while testing): delete the
# whole cloudflared service below - TUNNEL_TOKEN is required while it is in this
# file, even if you only start the arena - and add `ports: ["8090:8090"]` to the
# arena service. Over plain http also set ARENA_SECURE_COOKIES=0 in .env (a
# Secure cookie is dropped over http).

services:
  arena:
    build: ./server
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      ARENA_ADMIN_USER: admin
      ARENA_ADMIN_NAME: Admin
      ARENA_ADMIN_PASSWORD: "${ARENA_ADMIN_PASSWORD:?put ARENA_ADMIN_PASSWORD in .env}"
      # Lost the password? Put a new one in .env, set this to 1, restart, then back to 0.
      ARENA_ADMIN_RESET: "${ARENA_ADMIN_RESET:-0}"
      # Only the string "0" turns Secure cookies off.
      ARENA_SECURE_COOKIES: "${ARENA_SECURE_COOKIES:-1}"
    volumes:
      - ./server/data:/data
    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?put TUNNEL_TOKEN in .env}"
    depends_on:
      - arena
    security_opt:
      - no-new-privileges:true
