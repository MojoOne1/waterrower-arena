<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>WaterRower Arena</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🚣</text></svg>">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- Sign in ------------------------------------------------------------- -->

  <form id="join-form" class="card gate-card" hidden>
    <h1 data-i18n="joinTitle"></h1>
    <p class="hint" id="join-who"></p>
    <label><span data-i18n="labelDisplayName"></span><input id="join-display" autocomplete="nickname"></label>
    <label><span data-i18n="labelNewPassword"></span><input id="join-pass" type="password" autocomplete="new-password" minlength="12" required></label>
    <div class="form-foot">
      <span id="join-msg" class="form-msg"></span>
      <button class="primary" type="submit" data-i18n="btnJoin"></button>
    </div>

<!-- App ----------------------------------------------------------------- -->
<div id="app" hidden>
  <header class="top">
    <div class="top-row">
      <h1 data-i18n="appName">WaterRower Arena</h1>
      <span id="conn" class="conn" title=""><span class="dot"></span><span id="conn-text"></span></span>
      <span class="spacer"></span>
      <div class="seg lang" role="group">
        <button type="button" data-lang="de">DE</button><button type="button" data-lang="en">EN</button>
      </div>
      <div class="seg theme" id="theme" role="group">
        <button type="button" data-theme="auto" data-i18n="themeAuto"></button
        ><button type="button" data-theme="light" data-i18n="themeLight"></button
        ><button type="button" data-theme="dark" data-i18n="themeDark"></button>
      </div>
      <span id="whoami" class="whoami"></span>
      <button type="button" id="logout" class="logout" data-i18n="logout"></button>
    </div>
    <nav class="seg nav" id="nav" role="tablist">
      <button type="button" data-view="arena" data-i18n="navArena"></button
      ><button type="button" data-view="race" data-i18n="navRace"></button
      ><button type="button" data-view="sessions" data-i18n="navSessions"></button
      ><button type="button" data-view="records" data-i18n="navRecords"></button
      ><button type="button" data-view="badges" data-i18n="navBadges"></button
      ><button type="button" data-view="account" data-i18n="navAccount"></button>
    </nav>
  </header>

  <main id="view" class="view"></main>

  <footer class="foot">
    <span id="foot-version"></span>
    <span class="foot-sep"> · </span>
    <span class="repo-links"><a href="https://github.com/MojoOne1/waterrower-esp" target="_blank" rel="noopener noreferrer"><svg class="ico gh" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.03 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656"/></svg>waterrower-esp</a> · <a href="https://github.com/MojoOne1/waterrower-arena" target="_blank" rel="noopener noreferrer"><svg class="ico gh" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.03 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656"/></svg>waterrower-arena</a></span>
  </footer>
</div>

<template id="tpl-arena">
  <section class="stack">
    <div id="race-banner"></div>
    <h2 data-i18n="arenaNow"></h2>
    <div id="live-cards" class="cards"></div>
    <h2 data-i18n="arenaWeek"></h2>
    <div id="totals" class="totals"></div>
  </section>
</template>

<template id="tpl-race">
  <section class="stack">
    <div id="race-live"></div>
    <div id="race-new"></div>
    <h2 data-i18n="raceHistory"></h2>
    <div id="race-list"></div>
  </section>
</template>

<template id="tpl-sessions">
  <section class="stack">
    <div class="filters">
      <label><span data-i18n="filterAthlete"></span><select id="f-athlete"></select></label>
      <label><span data-i18n="filterRange"></span><select id="f-days"></select></label>
      <span class="spacer"></span>
      <a id="export-all" class="button-link" data-i18n="exportAll"></a>
      <button type="button" id="cmp-clear" data-i18n="clearSelection"></button>
    </div>
    <div class="split">
      <div class="list"><ul id="session-list"></ul></div>
      <div class="detail" id="session-detail"></div>
    </div>
    <div id="compare"></div>
  </section>
</template>

<template id="tpl-badges">
  <section class="stack">
    <div id="badge-summary"></div>
    <div id="badge-grid" class="badge-grid"></div>
    <h2 data-i18n="badgesRecent"></h2>
    <div id="badge-recent"></div>
  </section>
</template>

<template id="tpl-records">
  <section class="stack">
    <h2 data-i18n="recordsDistance"></h2>
    <div id="rec-distance" class="rec-grid"></div>
    <h2 data-i18n="recordsTime"></h2>
    <div id="rec-time" class="rec-grid"></div>
    <h2 data-i18n="recordsTotals"></h2>
    <div id="rec-totals"></div>
    <h2 data-i18n="recordsH2h"></h2>
    <div id="rec-h2h"></div>
  </section>
</template>

<template id="tpl-account">
  <section class="stack">
    <h2 data-i18n="accProfile"></h2>
    <div id="acc-profile"></div>
    <h2 data-i18n="accTokens"></h2>
    <div id="acc-tokens"></div>
    <div id="acc-backup"></div>
    <div id="acc-badges"></div>
    <div id="acc-templates"></div>
    <div id="acc-security"></div>
    <div id="acc-admin"></div>
  </section>
</template>

<script src="/static/app.js"></script>
<script src="/static/charts.js"></script>
<script src="/static/views.js"></script>
<script src="/static/race.js"></script>
<script src="/static/badges.js"></script>
</body>
</html>
